[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aifpl"
version = "0.1.0"
description = "Reproducible data and backtesting backend for an FPL agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "ortools>=9.10,<10.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
aifpl = "aifpl.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/aifpl"]
