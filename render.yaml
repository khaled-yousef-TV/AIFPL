services:
  - type: web
    name: aifpl-backend
    rootDir: .
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install '.[dev]'
    preDeployCommand: sh scripts/render-bootstrap.sh
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /health
    disk:
      name: aifpl-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: AIFPL_DATA_DIR
        value: /var/data
      - key: AIFPL_CORS_ORIGINS
        value: https://fplai.nl,https://www.fplai.nl
      - key: AIFPL_ADMIN_API_KEY
        generateValue: true
      - key: ODDS_API_KEY
        sync: false
      - key: HERMES_API_KEY
        sync: false
      - key: HERMES_BASE_URL
        value: https://api.deepseek.com
      - key: HERMES_MODEL
        value: deepseek-v4-flash
      - key: AIFPL_HERMES_AUTO_RUN
        value: "true"
      - key: AIFPL_RENDER_BOOTSTRAP
        value: "true"
      - key: AIFPL_RENDER_BOOTSTRAP_START_GAMEWEEK
        value: "1"
      - key: AIFPL_RENDER_BOOTSTRAP_END_GAMEWEEK
        value: "6"
      - key: AIFPL_RENDER_BOOTSTRAP_BUDGET
        value: "1000"
      - key: AIFPL_RENDER_BOOTSTRAP_SEASON
        value: "2025-26"
      - key: AIFPL_FETCH_EVENT_MARKETS
        value: "true"
      - key: AIFPL_EVENT_MARKET_MAX_EVENTS
        value: "10"
      - key: AIFPL_TELEGRAM_ENABLED
        value: "false"
      - key: AIFPL_TELEGRAM_BOT_TOKEN
        sync: false
      - key: AIFPL_TELEGRAM_CHAT_ID
        sync: false

  - type: static
    name: aifpl-dashboard
    rootDir: .
    buildCommand: sh scripts/render-build-frontend.sh
    staticPublishPath: mockups
    envVars:
      - key: AIFPL_API_URL
        value: https://api.fplai.nl
